name: Daily Mounjaro Cycle Check

on:
  schedule:
    # Runs automatically every day at 11:30 UTC (6:30 AM CDT)
    - cron: '30 11 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub

jobs:
  run-analyzer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Cycle Analyzer
        env:
          TIDEPOOL_EMAIL: ${{ secrets.TIDEPOOL_EMAIL }}
          TIDEPOOL_PASSWORD: ${{ secrets.TIDEPOOL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python analyzer.py
